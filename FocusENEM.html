<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>FocusENEM - Gerenciador Time Box</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 1.2rem;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .timer-display {
            font-size: 2.8rem;
            font-weight: bold;
            color: #e74c3c;
            margin: 0.4rem 0;
            font-family: monospace;
        }

        .form-group {
            text-align: left;
            margin-bottom: 0.6rem;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #34495e;
            display: block;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.85rem;
        }

        button {
            background: #27ae60;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 0.4rem;
        }

        .stop-btn {
            background: #e74c3c;
            display: none;
        }

        ul {
            list-style: none;
            padding: 0;
            max-height: 90px;
            overflow-y: auto;
        }

        li {
            background: #f8f9fa;
            padding: 0.35rem;
            border-left: 3px solid #27ae60;
            margin-bottom: 0.35rem;
            font-size: 0.8rem;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>■ FocusENEM - Time Box</h2>
        <div class="form-group">
            <label>Área do ENEM:</label>
            <select id="materia">
                <option value="Matemática">Matemática</option>
                <option value="Redação">Redação</option>
                <option value="Linguagens">Linguagens</option>
                <option value="Ciências da Natureza">Ciências da Natureza</option>
                <option value="Ciências Humanas">Ciências Humanas</option>
            </select>
        </div>
        <div class="form-group">
            <label>conteúdo especifíco:</label>
            <input type="text" id="conteudo">
        </div>
        <div class="form-group">
            <label>Duração (minutos):</label>
            <input type="number" id="duracao" value="25" min="1" max="60" oninput="atualizarTempoInicial()"
                onchange="atualizarTempoInicial()">
        </div>
        <h1 id="texto">TEMPO DO BLOCO</h1>
        <div class="timer-display" id="timer">25:00</div>
        <button id="startBtn" onclick="iniciarTimeBox()">Iniciar Bloco de Foco</button>
        <button id="stopBtn" class="stop-btn" onclick="pararTimeBox()">Interromper Bloco</button>
        <div style="text-align:left; margin-top:0.8rem;">
            <h4 style="margin:0 0 0.2rem 0; font-size:0.85rem;">Blocos Concluídos</h4>
            <ul id="listaHistorico"></ul>
        </div>
    </div>
    <script>
        let tempoRestante = 0;
        let timerInterval = null;
        function atualizarDisplay(segundos) {
            const min = String(Math.floor(segundos / 60)).padStart(2, '0');
            const seg = String(segundos % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${min}:${seg}`;
        }
        function atualizarTempoInicial() {
            const min = parseInt(document.getElementById('duracao').value);
            if (!isNaN(min) && min > 0) atualizarDisplay(min * 60);
        }
        function iniciarTimeBox() {
            document.getElementById('texto').innerHTML = "TEMPO RESTANTE";
            const min = parseInt(document.getElementById('duracao').value);
            if (isNaN(min) || min <= 0) return alert('Tempo inválido.');
            tempoRestante = min * 60; atualizarDisplay(tempoRestante);
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            timerInterval = setInterval(() => {
                tempoRestante--; atualizarDisplay(tempoRestante);
                if (tempoRestante <= 0) {
                    clearInterval(timerInterval);
                    alert('■ Time Box encerrada! Faça sua pausa obrigatória.');
                    registrarBloco();
                    startBreak();
                }
            }, 1000);
        }
        function pararTimeBox() { 
            clearInterval(timerInterval);
            alert('Bloco interrompido.');
            resetsInterface(); }

        function resetsInterface() {
            document.getElementById('texto').innerHTML = "TEMPO DO BLOCO";
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
            atualizarTempoInicial();
        }
        function registrarBloco() {
            const materia = document.getElementById('materia').value;
            const conteudo = document.getElementById('conteudo').value;
            const min = document.getElementById('duracao').value;
            const item = document.createElement('li');
            item.innerText = `■ ${materia}, ${conteudo} - Bloco de ${min} min concluído.`;
            document.getElementById('listaHistorico').appendChild(item);
        }

        function startBreak(){
            document.getElementById('texto').innerHTML = "TEMPO RESTANTE DA PAUSA";
            const min = parseInt(5);
            tempoRestante = min * 60; atualizarDisplay(tempoRestante);
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            timerInterval = setInterval(() => {
                tempoRestante--; atualizarDisplay(tempoRestante);
                if (tempoRestante <= 0) {
                    clearInterval(timerInterval);
                    alert('■ Time Box encerrada! Fim da sua pausa obrigatória.');
                    resetsInterface();
                }
            }, 1000);
        }
    </script>
</body>

</html>
